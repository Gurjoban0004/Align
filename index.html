<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Align">
  <meta name="theme-color" content="#cc785c">
  <meta name="description" content="Align — Your AI-powered life intelligence system. Track, understand, and align with your goals.">

  <title>Align</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="apple-touch-icon" href="./logo.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- Styles (order matters: tokens → base → components → views) -->
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/views.css">
</head>
<body>
  <!-- App Shell -->
  <div id="app-root">
    <!-- Top nav (desktop) and bottom nav (mobile) injected by JS -->

    <!-- View container — router renders here -->
    <main id="view-container" role="main">
      <!-- Loading state -->
      <div class="placeholder-view">
        <p style="font-family: var(--font-display); font-size: 1.5rem; color: var(--text-muted); font-style: italic;">
          Loading Align…
        </p>
      </div>
    </main>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
